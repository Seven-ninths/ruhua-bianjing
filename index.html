<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee1">
  <meta name="description" content="展开《清明上河图》，从郊外的赶路人、虹桥下的船工和街市里的店伙计眼中看汴京。">
  <title>入画汴京 · 清明上河图互动长卷</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./exhibit.css">
  <script defer src="./scroll-people.js"></script>
  <script defer src="./traveler-people.js"></script>
  <script defer src="./road-atmosphere.js"></script>
  <script defer src="./boat-people.js"></script>
  <script defer src="./boat-view.js"></script>
  <script defer src="./river-atmosphere.js"></script>
  <script defer src="./river-traffic.js"></script>
  <script defer src="./boat-rig.js"></script>
  <script defer src="./shop-people.js"></script>
  <script defer src="./scene-journeys.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="masthead shell">
    <a class="wordmark" href="./" aria-label="入画汴京首页">
      <span class="seal" aria-hidden="true">汴</span>
      <span>入画汴京</span>
    </a>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">入画汴京</h1>
        <p class="subtitle">展开《清明上河图》，从画中人的眼睛看一段汴京日常。</p>
      </div>
      <p class="painting-credit"><cite>清明上河图</cite><span>北宋 · 张择端 · 绢本设色</span></p>
    </section>

    <section class="exhibit" aria-label="清明上河图互动长卷">
      <div class="exhibit-bar">
        <div class="chapters" role="group" aria-label="跳转到长卷段落">
          <button type="button" data-go="traveler" aria-pressed="true">城郊</button>
          <button type="button" data-go="boatman" aria-pressed="false">虹桥</button>
          <button type="button" data-go="shopkeeper" aria-pressed="false">街市</button>
        </div>
        <div class="exhibit-actions">
          <button id="enter-current" class="enter-current" type="button"><span id="enter-current-label">跟赶路人沿汴河往城里走</span><span aria-hidden="true">↗</span></button>
        </div>
      </div>

      <div class="scroll-frame">
        <div id="viewport" class="viewport" tabindex="0" aria-label="长卷浏览区" aria-describedby="scroll-help">
          <div id="world" class="world">
            <img id="scroll-image" class="scroll-image" src="./assets/scroll.webp" alt="北宋张择端《清明上河图》卷，从右侧的城郊到虹桥，再到左侧街市" draggable="false">
            <div id="hotspots"></div>
          </div>
        </div>
        <button id="move-left" class="step step-left" type="button" aria-label="向左浏览，前往街市">‹</button>
        <button id="move-right" class="step step-right" type="button" aria-label="向右浏览，返回城郊">›</button>
      </div>

      <div class="scroll-guide">
        <p id="scroll-help">拖动画卷浏览，点画中人物也能进入视角。</p>
        <span id="current-location" class="current-location">城郊 · 赶路人</span>
      </div>
      <div class="overview">
        <span aria-hidden="true">街市</span>
        <div id="map" class="map">
          <img src="./assets/scroll.webp" alt="" draggable="false">
          <div id="viewfinder" class="viewfinder" aria-hidden="true"></div>
          <input id="map-range" type="range" min="0" max="1000" value="1000" aria-label="全卷位置，从街市到城郊">
        </div>
        <span aria-hidden="true">城郊</span>
      </div>
    </section>

    <section class="people" aria-labelledby="people-title">
      <h2 id="people-title">画中人物</h2>
      <div id="people-list" class="people-list"></div>
    </section>
  </main>

  <footer class="shell footer">
    <p>《清明上河图》跨媒介再创作 · 新媒体艺术概论课堂实践</p>
    <div><a href="https://commons.wikimedia.org/wiki/File:Alongtheriver_QingMing.jpg" target="_blank" rel="noopener noreferrer">数字图像来源 ↗</a> <a href="https://www.dpm.org.cn/collection/paint/228226.html?hl=%E3%80%8A%E6%B8%85%E6%98%8E%E4%B8%8A%E6%B2%B3%E5%9C%96%E3%80%8B" target="_blank" rel="noopener noreferrer">原作与馆藏说明 ↗</a></div>
  </footer>

  <dialog id="scene" class="scene-dialog" aria-labelledby="scene-title">
    <div id="scene-stage" class="scene-stage">
      <div id="scene-look" class="scene-look" role="region" tabindex="0" aria-label="第一人称场景，用方向键环顾" title="拖动场景环顾">
        <div id="scene-world" class="scene-world" aria-hidden="true">
          <div id="scene-art" class="scene-art"></div>
        </div>
      </div>
      <div class="scene-shade" aria-hidden="true"></div>
      <header class="scene-top">
        <div>
          <p id="scene-location"></p>
          <h2 id="scene-title"></h2>
          <ol id="scene-phases" class="scene-phases" aria-label="过桥进程" hidden>
            <li>进桥</li><li>放桅</li><li>出桥</li>
          </ol>
        </div>
        <button id="scene-back" type="button" class="scene-back" autofocus>返回长卷 <span aria-hidden="true">×</span></button>
      </header>
      <div class="scene-bottom">
        <p id="scene-caption" class="scene-caption" aria-live="polite"></p>
        <div class="scene-controls">
          <button id="scene-evidence" class="scene-control scene-control-primary" type="button" hidden>查看原画依据</button>
          <button id="scene-pause" class="scene-control" type="button">停留片刻</button>
          <span id="scene-hint">拖动画面可环顾</span>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="evidence" class="evidence-dialog" aria-labelledby="evidence-title">
    <article class="evidence-card">
      <header>
        <h2 id="evidence-title"></h2>
        <form method="dialog"><button type="submit" aria-label="关闭原画依据">×</button></form>
      </header>
      <div class="evidence-compare">
        <figure>
          <figcaption>原画局部</figcaption>
          <div id="evidence-crop" class="evidence-image evidence-crop">
            <img src="./assets/scroll.webp" alt="该场景所在的原画局部">
            <span class="evidence-pin" aria-hidden="true"></span>
          </div>
        </figure>
        <figure>
          <figcaption>第一人称场景</figcaption>
          <img id="evidence-still" class="evidence-image evidence-still" alt="">
        </figure>
      </div>
      <dl>
        <div><dt>原画所见</dt><dd id="evidence-fact"></dd></div>
        <div><dt>场景演绎</dt><dd id="evidence-scene"></dd></div>
      </dl>
      <a href="https://www.dpm.org.cn/collection/paint/228226.html?hl=%E3%80%8A%E6%B8%85%E6%98%8E%E4%B8%8A%E6%B2%B3%E5%9C%96%E3%80%8B" target="_blank" rel="noopener noreferrer">查看故宫博物院藏品说明 ↗</a>
    </article>
  </dialog>
</body>
</html>
